# Version updates open pull requests against the default branch, develop.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      umbraco:
        patterns: ["Umbraco.*"]
    # The package's references in src/Directory.Packages.props stay at the lowest Umbraco version it supports. The
    # demo's Umbraco.Cms keeps getting updates.
    ignore:
      # The package supports one Umbraco major at a time, so a new major is a decision, not an update.
      - dependency-name: "Umbraco.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Umbraco.Cms.Api.Common"
      - dependency-name: "Umbraco.Cms.Api.Management"
      - dependency-name: "Umbraco.Cms.Web.Common"

  - package-ecosystem: npm
    directory: /src/Umbricians.FeatureFlags/Client
    schedule:
      interval: weekly
    # @umbraco-cms/backoffice stays at the lowest Umbraco version the package supports, and @types/node at the
    # Node major CI runs.
    ignore:
      - dependency-name: "@umbraco-cms/backoffice"
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /src/Umbricians.FeatureFlags.Types
    schedule:
      interval: weekly
    # The types check against the lowest Umbraco version the package supports, and @types/node stays at the Node major
    # CI runs.
    ignore:
      - dependency-name: "@umbraco-cms/backoffice"
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
